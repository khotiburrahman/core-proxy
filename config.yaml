app:
  log_level: info
  log_type: text
  api_addr: "127.0.0.1:8080"

socks5:
  listen_addr: "127.0.0.1:1085"
  username: ""
  password: ""

workers:
  - id: "ssh-sg-1"
    type: "ssh"
    host: "biznet.vpnstore28.biz.id"
    port: 22
    username: "hehe"
    password: "hehe"
    private_key: ""
    payload_name: "connect-raw"
    remote_proxy: "1.2.3.4:80"
    connect_timeout: "10s"
    keepalive_sec: 30

outbounds:
  - name: "pool-sg"
    type: "pool"
    worker_ids: ["ssh-sg-1"]
    strategy: "least_conn"
  - name: "direct"
    type: "direct"

rules:
  - type: "domain_suffix"
    value: "vidio.com"
    outbound: "pool-sg"
  - type: "domain_keyword"
    value: "netflix"
    outbound: "pool-sg"
  - type: "cidr"
    value: "10.0.0.0/8"
    outbound: "direct"
  - type: "match"
    value: ""
    outbound: "direct"

domains: []

payloads:
  - name: "connect-raw"
    data: "[raw]"

  - name: "connect-explicit"
    data: "CONNECT [host]:[port] HTTP/1.1[crlf]Host: [host][crlf][crlf]"