name: Build Binary

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Tidy modules
        run: go mod tidy

      - name: Vet
        run: go vet ./...

      - name: Cross-Compile Binary (ARM64 & AMD64)
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/core-proxy-linux-arm64 ./cmd/proxy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/core-proxy-linux-amd64 ./cmd/proxy

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-proxy-binaries
          path: dist/*

